name: "RB FL0 / pinned full Flow-Lenia original source"
on:
  pull_request:
    branches:
      - research/rb-r6-developmental-substrates-2026-10-22
    paths:
      - "scripts/rb_original_flowlenia_source_replay.py"
      - "scripts/rb_original_flowlenia_embedded_P_probe.py"
      - "scripts/rb_sensorimotor_lenia_archive_index.py"
      - "docs/research/RB_FL0_*"
      - "docs/research/RB_FL1_*"
      - ".github/workflows/rb-original-flowlenia.yml"
  workflow_dispatch:
jobs:
  original-source:
    if: github.event_name != 'pull_request' || github.head_ref == 'research/rb-original-flowlenia-closed-loop-2026-10-23'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      JAX_PLATFORMS: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: "false"
      XLA_FLAGS: "--xla_cpu_multi_thread_eigen=false intra_op_parallelism_threads=2"
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded original-source CPU dependencies
        run: python -m pip install "numpy>=1.26,<2" "jax[cpu]==0.4.35" "equinox==0.11.10" "jaxtyping==0.2.36" "matplotlib>=3.8,<4"
      - name: Get exact original external upstream source, not our adapted R6 operator
        run: |
          git clone -q https://github.com/erwanplantec/FlowLenia.git .upstream-FlowLenia
          git -C .upstream-FlowLenia checkout -q dce428c6b0c5079a06e5606fb7b5ac1fe1323bc5
          test "$(git -C .upstream-FlowLenia rev-parse HEAD)" = "dce428c6b0c5079a06e5606fb7b5ac1fe1323bc5"
      - name: Run exactly 3 x 80 original whole-JAX updates and observe actual perturbation effects
        env:
          PYTHONPATH: ".upstream-FlowLenia:."
        run: python scripts/rb_original_flowlenia_source_replay.py
      - name: Execute original local parameter-field flow with no callbacks or mutation
        env:
          PYTHONPATH: ".upstream-FlowLenia:."
        run: python scripts/rb_original_flowlenia_embedded_P_probe.py
      - name: Check external authored sensorimotor-state record catalog, metadata only
        run: python scripts/rb_sensorimotor_lenia_archive_index.py
      - name: Preserve unedited measured source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rb-fl0-original-source
          path: |
            artifacts/fl0/*.json
            artifacts/fl1/*.json
            artifacts/donors/*.json
          if-no-files-found: ignore
