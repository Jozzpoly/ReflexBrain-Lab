name: Research Preview

on:
  push:
    branches:
      - experiment/organism-recovery-v0
      - research/pre-o0-foundations-campaign
      - run/octrl-b01b-b0-scale-passage
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: reflexbrain-research-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: yarn install --non-interactive
      - run: yarn run check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: r0-pages-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy branch preview
        id: deployment
        uses: actions/deploy-pages@v4
