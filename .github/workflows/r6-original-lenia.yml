name: "ReflexBrain R6 / original Lenia donor"
on:
  pull_request:
    branches:
      - research/rb-life-l1-durable-process-2026-10-21
    paths:
      - "research/r6/**"
      - "scripts/r6_orbium_probe.py"
      - "tests/r6_orbium_donor_test.py"
      - "tests/r6_orbium_o1_test.py"
      - ".github/workflows/r6-original-lenia.yml"
      - "docs/research/RB_R6_*"
  workflow_dispatch:
jobs:
  canonical-donor:
    if: github.event_name != 'pull_request' || github.head_ref == 'research/rb-r6-developmental-substrates-2026-10-22'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "numpy>=1.26,<3"
      - name: Verify original notebook seed and unperturbed numerical fidelity
        run: python -m unittest discover -s tests -p 'r6_orbium_donor_test.py' -v
      - name: O1 mass-conserving structural controls
        run: python -m unittest discover -s tests -p 'r6_orbium_o1_test.py' -v
      - name: Run six original-Lenia controlled perturbations and O1 variants
        run: python -m scripts.r6_orbium_probe
      - name: Preserve numerical donor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rb-r6-original-lenia
          path: artifacts/r6/*.json
          if-no-files-found: ignore
