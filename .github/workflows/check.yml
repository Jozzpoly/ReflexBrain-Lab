name: Check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: yarn install --non-interactive
      - run: yarn run check


  browser-r3g:
    if: github.event_name == 'pull_request' && github.head_ref == 'medium/medium-d-r3g-runtime-clean-pointer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: yarn install --non-interactive
      - run: yarn run build
      - name: Confirm system Chrome
        run: google-chrome --version
      - name: Install pinned Playwright client only
        run: yarn add --dev --ignore-scripts playwright-core@1.56.0
      - name: Start Vite preview
        run: |
          yarn vite preview --host 127.0.0.1 --port 4173 > /tmp/r3g-vite.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/probes/medium-d-r3e-spatial-proxy.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/r3g-vite.log
          exit 1
      - name: Run reproduced real pointer-path browser probe
        run: node tests/browser/r3g-spatial-proxy.e2e.mjs
      - name: Upload R3G browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medium-d-r3g-browser-evidence
          path: artifacts/r3g
          if-no-files-found: ignore

  browser-world-d0:
    if: github.event_name == 'pull_request' && github.head_ref == 'research/world-ecology-d0-2026-10-11'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build real World D0 entry
        run: |
          yarn install --non-interactive
          yarn run build
          test -f dist/probes/world-ecology-d0.html
      - name: Verify system Chrome
        run: google-chrome --version
      - name: Install isolated browser QA driver
        run: yarn add --dev --ignore-scripts playwright-core@1.56.0
      - name: Serve real compiled multi-entry Vite app
        run: |
          yarn vite preview --host 127.0.0.1 --port 4173 > /tmp/rb-d0-vite.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/probes/world-ecology-d0.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/rb-d0-vite.log
          exit 1
      - name: Real Chromium evidence for independent World and manual exploration
        run: node tests/browser/world-ecology-d0.e2e.mjs
      - name: Preserve actual D0 World and responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reflexbrain-world-d0-chromium
          path: artifacts/world-d0
          if-no-files-found: ignore

  browser-world-d1:
    if: github.event_name == 'pull_request' && github.head_ref == 'research/world-ecology-d1-coupled-affordance-2026-10-11'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compile D1 physics and real multi-page browser entry
        run: |
          yarn install --non-interactive
          yarn run build
          test -f dist/probes/world-ecology-d1.html
      - name: System Chrome availability
        run: google-chrome --version
      - name: Install browser test driver
        run: yarn add --dev --ignore-scripts playwright-core@1.56.0
      - name: Launch actual Vite built preview
        run: |
          yarn vite preview --host 127.0.0.1 --port 4175 > /tmp/d1-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4175/probes/world-ecology-d1.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/d1-preview.log
          exit 1
      - name: Real Chrome recurring rail, reversible plate mass, force-gate and mobile checks
        run: node tests/browser/world-ecology-d1.e2e.mjs
      - name: Preserve D1 real browser screenshot and JSON outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reflexbrain-world-d1-chromium
          path: artifacts/world-d1
          if-no-files-found: ignore

  browser-world-d1-public:
    if: github.event_name == 'pull_request' && github.head_ref == 'research/world-ecology-d1-coupled-affordance-2026-10-11'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify both real public Pages D1 HTML and built JS asset
        run: |
          URL="https://jozzpoly.github.io/ReflexBrain-Lab/world-d1/"
          curl -fsS "$URL" -o /tmp/public-d1.html
          grep -q 'nie ma autonomicznego mózgu' /tmp/public-d1.html
          JS=$(grep -oE '../assets/[^"]+' /tmp/public-d1.html | head -1)
          test -n "$JS"
          curl -fsS "https://jozzpoly.github.io/ReflexBrain-Lab/world-d1/$JS" -o /tmp/public-d1.js
          test -s /tmp/public-d1.js
          echo "Public JS module available; real Chromium will validate module execution."
      - name: Install Chrome test driver
        run: |
          yarn install --non-interactive
          yarn add --dev --ignore-scripts playwright-core@1.56.0
      - name: REAL PUBLIC CHROMIUM three gate states and material Owner intervention
        run: node tests/browser/world-ecology-d1.e2e.mjs
        env:
          RB_WORLD_D1_URL: https://jozzpoly.github.io/ReflexBrain-Lab/world-d1/
      - name: Keep seven public real Chromium viewport and material screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reflexbrain-world-d1-PUBLIC-chromium
          path: artifacts/world-d1
          if-no-files-found: ignore

  browser-b1-material:
    if: github.event_name == 'pull_request' && (github.head_ref == 'research/rb-body-b1-material-affordance-2026-10-21' || github.head_ref == 'research/rb-experience-contract-2026-10-21')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build isolated B0/B1 physical comparison
        run: |
          yarn install --non-interactive
          yarn run build
          test -f dist/probes/b1-material-field.html
      - name: System Chrome availability
        run: google-chrome --version
      - name: Install standalone browser driver
        run: yarn add --dev --ignore-scripts playwright-core@1.56.0
      - name: Run true Chrome material/manual/mobile test
        run: |
          yarn vite preview --host 127.0.0.1 --port 4177 > /tmp/b1-vite.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4177/probes/b1-material-field.html >/dev/null; then break; fi
            sleep 1
          done
          node tests/browser/b1-material-field.e2e.mjs
      - name: Archive actual Chrome screenshots and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reflexbrain-b1-material-browser
          path: artifacts/b1-material-field
          if-no-files-found: ignore

  browser-odev-v0:
    if: github.event_name == 'pull_request' && github.head_ref == 'research/rb-odev-first-resident-2026-10-21'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build actual continuous resident
        run: |
          yarn install --non-interactive
          yarn run build
          test -f dist/probes/dev-resident-v0.html
      - name: Chrome availability
        run: google-chrome --version
      - name: Lightweight Chrome driver
        run: yarn add --dev --ignore-scripts playwright-core@1.56.0
      - name: Real Chrome browser, mobile, intervention, restoration
        run: |
          yarn vite preview --host 127.0.0.1 --port 4179 > /tmp/odev-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4179/probes/dev-resident-v0.html >/dev/null; then break; fi
            sleep 1
          done
          node tests/browser/odev-v0-resident.e2e.mjs
      - name: Real screenshots and forensic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reflexbrain-odev-v0-chrome
          path: artifacts/odev-v0
          if-no-files-found: ignore
