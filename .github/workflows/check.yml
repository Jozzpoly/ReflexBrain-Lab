name: Check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: yarn install --non-interactive
      - run: yarn run check


  browser-r3g:
    if: github.event_name == 'pull_request' && github.head_ref == 'medium/medium-d-r3g-runtime-clean-pointer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: yarn install --non-interactive
      - run: yarn run build
      - name: Confirm system Chrome
        run: google-chrome --version
      - name: Install pinned Playwright client only
        run: yarn add --dev --ignore-scripts playwright-core@1.56.0
      - name: Start Vite preview
        run: |
          yarn vite preview --host 127.0.0.1 --port 4173 > /tmp/r3g-vite.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/probes/medium-d-r3e-spatial-proxy.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/r3g-vite.log
          exit 1
      - name: Run reproduced real pointer-path browser probe
        run: node tests/browser/r3g-spatial-proxy.e2e.mjs
      - name: Upload R3G browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medium-d-r3g-browser-evidence
          path: artifacts/r3g
          if-no-files-found: ignore

  browser-material-owner:
    if: github.event_name == 'pull_request' && github.head_ref == 'research/material-organism-owner-view-2026-10-11'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: yarn install --non-interactive
      - run: yarn run build
      - name: Check system Chrome
        run: google-chrome --version
      - name: Install pinned Playwright client for QA only
        run: yarn add --dev --ignore-scripts playwright-core@1.56.0
      - name: Run isolated Vite preview
        run: |
          yarn vite preview --host 127.0.0.1 --port 4173 > /tmp/rb-owner-vite.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/probes/material-organism.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/rb-owner-vite.log
          exit 1
      - name: Inspect real WASM + UI interactions and capture evidence
        run: node tests/browser/material-owner-view.e2e.mjs
      - name: Upload interactive World / Owner evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rb-material-owner-browser-evidence
          path: artifacts/rb-owner
          if-no-files-found: ignore

  browser-material-lite:
    if: github.event_name == 'pull_request' && github.head_ref == 'research/material-organism-owner-view-2026-10-11'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated tiny demo only
        run: npm install --no-audit --no-fund
        working-directory: playmat-lite
      - name: Typecheck and build isolated static demo
        run: npm run check
        working-directory: playmat-lite
      - name: Verify built files do not depend on research corpus
        run: |
          test -f playmat-lite/dist/index.html
          test -d playmat-lite/dist/assets
          if grep -E 'src/living-organism|\.\./evidence|/probes/material-organism.html' playmat-lite/dist/index.html; then exit 1; fi
      - name: Confirm Chrome
        run: google-chrome --version
      - name: Install browser driver for smoke only
        run: yarn add --dev --ignore-scripts playwright-core@1.56.0
      - name: Start standalone static preview
        run: |
          (cd playmat-lite && ./node_modules/.bin/vite preview --host 127.0.0.1 --port 4174) > /tmp/rb-lite-vite.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/rb-lite-vite.log
          exit 1
      - name: Verify real interactions and full 60s outcome in standalone static bundle
        run: node tests/browser/material-owner-view.e2e.mjs
        env:
          RB_OWNER_URL: http://127.0.0.1:4174/
      - name: 'Deep browser playability stress: manipulation, cancellation, provenance, mobile-width layout'
        run: node tests/browser/material-owner-robustness.e2e.mjs
        env:
          RB_OWNER_URL: http://127.0.0.1:4174/
      - name: Retain static single-purpose preview as downloadable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reflexbrain-s0-static-playmat
          path: playmat-lite/dist
          if-no-files-found: ignore
      - name: Retain standalone browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reflexbrain-s0-lite-browser-evidence
          path: artifacts/rb-owner
          if-no-files-found: ignore
      - name: Retain robust Chrome interaction/red-team screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reflexbrain-s0-lite-robustness-evidence
          path: artifacts/rb-robust
          if-no-files-found: ignore

  browser-material-public-pages:
    if: github.event_name == 'pull_request' && github.head_ref == 'research/material-organism-owner-view-2026-10-11'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check public page and independent JS asset availability
        run: |
          URL="https://jozzpoly.github.io/ReflexBrain-Lab/playmat-s0/"
          curl --fail --silent --show-error "$URL" -o /tmp/rb-public.html
          grep -q 'Czy ta istota naprawdę potrafi' /tmp/rb-public.html
          JS=$(grep -oE 'src="./assets/[^"]+"' /tmp/rb-public.html | head -1 | sed -e 's/^src="//' -e 's/"$//')
          if [ -z "$JS" ]; then echo "Missing built static JS asset path"; exit 1; fi
          curl --fail --silent --show-error "$URL${JS#./}" -o /tmp/rb-public.js
          test $(wc -c < /tmp/rb-public.js) -gt 1000000
      - name: Install pinned browser driver
        run: |
          yarn install --non-interactive
          yarn add --dev --ignore-scripts playwright-core@1.56.0
      - name: Exercise REAL deployed Pages via Chrome including all physical endpoints
        run: node tests/browser/material-owner-view.e2e.mjs
        env:
          RB_OWNER_URL: https://jozzpoly.github.io/ReflexBrain-Lab/playmat-s0/
      - name: Preserve public-site browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reflexbrain-s0-public-pages-browser-qa
          path: artifacts/rb-owner
          if-no-files-found: ignore
