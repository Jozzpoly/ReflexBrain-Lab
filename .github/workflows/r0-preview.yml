name: R0 Preview

on:
  push:
    branches:
      - experiment/r0-semantic-shadow-bootstrap
      - experiment/r1-ood-red-team-v1
      - experiment/r1-semantic-supervision-breadth-v1
      - experiment/r1-linear-ranking-head-v1
      - experiment/r1-relation-geometry-audit-v1
      - experiment/r1-cognition-supervision-breadth-v1
      - experiment/r1-isolated-embedding-v1
      - experiment/r1-expanded-representation-ab-v1
      - experiment/r1-train-coherence-evidence-v1
      - experiment/r1-prototype-bank-head-v1
      - experiment/r1-paired-reason-head-v1
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: r0-pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: yarn install --non-interactive
      - run: yarn run check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: r0-pages-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy branch preview
        id: deployment
        uses: actions/deploy-pages@v4
